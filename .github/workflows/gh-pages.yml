name: GithubPages

# Builds the documentation (guides + API reference generated from AppCUI/include/AppCUI.hpp by Doxygen and Breathe) and
# the live demos (the examples linked from docs/source/live_demos.rst, compiled to WebAssembly - published in demo/).
# Every warning is an error. Pushes to main publish the result to the gh-pages branch.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "docs/**"
      - "AppCUI/include/AppCUI.hpp"
      - "AppCUI/web/**"
      - "AppCUI/src/Terminal/BrowserTerminal/**"
      - "cmake/example.cmake"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Publishing runs one after another (the gh-pages push would fail if two runs raced); outdated PR builds are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: "6.0.12" # the Emscripten release the browser frontend is tested with
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The XML of Doxygen changes between versions -> a pinned, checksum-verified release (the one the documentation
      # is tested with) instead of the distribution package.
      - name: Cache Doxygen
        id: cache-doxygen
        uses: actions/cache@v6
        with:
          path: ~/doxygen
          key: doxygen-1.18.0-linux

      - name: Install Doxygen
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen.tar.gz" | sha256sum --check
          mkdir -p ~/doxygen
          tar -xzf doxygen.tar.gz -C ~/doxygen --strip-components=1
          rm doxygen.tar.gz

      - name: Doxygen version
        run: |
          echo "$HOME/doxygen/bin" >> "$GITHUB_PATH"
          ~/doxygen/bin/doxygen --version

      - name: Install Sphinx
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        working-directory: docs
        run: python -m sphinx -W --keep-going -b html -d build/doctrees source build/html

      # Live demos. The emsdk cache also keeps the Emscripten system libraries built by the first compilation.
      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-linux

      - name: Install emsdk
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"

      - name: Build live demos
        run: |
          sudo apt-get install -y ninja-build
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
          source ~/emsdk/emsdk_env.sh
          # the demos are exactly the examples linked as demo/<Example>.html by the live demos page
          mapfile -t demos < <(grep -oE 'demo/[A-Za-z0-9]+\.html' docs/source/live_demos.rst | sed 's#demo/##; s#\.html##' | sort -u)
          echo "Live demos: ${demos[*]}"
          test "${#demos[@]}" -gt 0
          emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --parallel --target "${demos[@]}"
          # a static site: <Example>.html / .mjs / .wasm + the shared host script and font (cp fails on a missing file)
          mkdir -p docs/build/html/demo
          for demo in "${demos[@]}"; do
            cp "bin/wasm/$demo.html" "bin/wasm/$demo.mjs" "bin/wasm/$demo.wasm" docs/build/html/demo/
          done
          cp bin/wasm/appcui-host.js bin/wasm/JuliaMono-Regular.ttf docs/build/html/demo/
          du -sh docs/build/html/demo

      - name: Publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          # replace the whole site (pages of removed classes must disappear), keep the git metadata
          rsync -a --delete --exclude ".git" docs/build/html/ gh-pages/
          touch gh-pages/.nojekyll
          cd gh-pages
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "Documentation unchanged"
          else
            git commit -m "Update documentation (${GITHUB_SHA::8})"
            git push origin gh-pages
          fi
