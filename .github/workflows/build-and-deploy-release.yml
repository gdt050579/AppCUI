name: build-and-deploy-release

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      isPreRelease:
        description: "Is this a pre-release?"
        required: true
        default: true
        type: boolean

# Releases are published one after another (never cancelled, each one has its own version)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lib_ext: lib
            vcpkg_triplet: x64-windows
            archive_tool: 7z
          - os: ubuntu-24.04
            lib_ext: a
            vcpkg_triplet: x64-linux
            archive_tool: zip
          - os: macos-15-intel
            lib_ext: a
            vcpkg_triplet: x64-osx
            archive_tool: zip

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The binaries are written in bin/ (APPCUI_ENABLE_OUTPUT_LOCATION -> ${CMAKE_BINARY_DIR}/../bin)
      - uses: ./.github/actions/build
        with:
          build_type: ${{ env.BUILD_TYPE }}
          use_vcpkg_cache: "true"
          jobs_count: "0"

      - name: Extract version
        shell: bash
        run: |
          version=$(python .github/workflows/get_version.py AppCUI/include/AppCUI.hpp)
          echo "APPCUI_VERSION=$version" >> "$GITHUB_ENV"

      # Copy static libs and terminfo if available
      - name: Copy libraries
        shell: bash
        run: |
          mkdir -p bin
          if [ -d "build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib" ]; then
            cp -R build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib/*.${{ matrix.lib_ext }} bin/ || true
          fi
          if [ -d "build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/share/terminfo" ]; then
            cp -R build/vcpkg_installed/${{ matrix.vcpkg_triplet }}/share/terminfo bin/ || true
          fi

      - name: List build outputs
        shell: bash
        run: ls -R bin

      # The archive is created next to bin/ (not inside it) so it never contains itself
      - name: Package build
        shell: bash
        run: |
          zipname="AppCUI-${{ runner.os }}-${{ runner.arch }}-${{ env.APPCUI_VERSION }}.zip"
          cd bin
          if [ "${{ matrix.archive_tool }}" = "7z" ]; then
            7z a "../$zipname" . > /dev/null
          else
            zip -9 -r "../$zipname" .
          fi
          echo "Created $zipname"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}_artifacts
          path: AppCUI-${{ runner.os }}-${{ runner.arch }}-${{ env.APPCUI_VERSION }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          version=$(python .github/workflows/get_version.py AppCUI/include/AppCUI.hpp)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          # Tag the built commit: "Version Increase" pushes a new commit on main in parallel with this workflow
          target_commitish: ${{ github.sha }}
          name: Build ${{ steps.version.outputs.version }}
          draft: false
          # Pushes on main are pre-releases; a manual run uses the isPreRelease input
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.isPreRelease }}
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
