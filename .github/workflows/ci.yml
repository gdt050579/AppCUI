name: build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A new push on the same pull request cancels the previous (now outdated) build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: ./.github/actions/build
        with:
          build_type: Release
          use_vcpkg_cache: "true"
          jobs_count: "0"

